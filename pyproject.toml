[project]
name = "simple-mestimators"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Truglut", email = "contrerasdesantos.andres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
scripts = [
    "mrcfile>=1.5.4",
    "pyyaml>=6.0.3",
]
test = [
    { include-group = "scripts" },
    "pytest>=9.1.1",
]
dev = [
    { include-group = "test" },
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
